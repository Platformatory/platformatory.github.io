baseurl: ""
url: "https://platformatory.io"
exclude:
  - "README.md"
  - "brand"
  - "v2"
  - "vendor"
permalink: pretty
title: "Platformatory | Forward Deployed Engineering Firm: Data, AI & Modernization"

google_analytics_id: "G-PWW2W71JX1"
homepage:
  show_call_box: true
logo:
  mobile: "images/logo/plf-logo.svg"
  desktop: "images/logo/plf-logo.svg"
  desktop_height: "76px"
footer:
  copyright_text: "&copy; All rights reserved YYYY. Platformatory LLC"

seo:
  meta_og_title: "Platformatory"
  meta_og_type: "website"
  meta_og_url: "https://platformatory.io"
  meta_og_image: "https://platformatory.io/images/logo/plf-logo.svg"
  meta_og_description: "Forward Deployed Engineering Firm: Data, AI & Modernization"
  meta_twitter_card: "summary"
  meta_twitter_site: "@platformatory"
  meta_twitter_creator: "@platformatory"

collections:
  services:
    output: false
  team:
    output: true
  consulting:
    output: false
  solutions:
    output: false
  openings:
    output: false
  engineering:
    output: false
  field-engineering:
    output: false
  events:
    output: true
    permalink: /events/:path
  education:
    output: false
  principles:
    output: true
    permalink: /platform-engineering/:name/
  case-studies:
    output: true
    permalink: /case-studies/:name/

# For events
future: true

sass:
  indentWidth: 4
  style: compact # possible values: nested expanded compact compressed
  precision: 10

plugins:
  - jekyll-environment-variables
  - jekyll-menus

defaults:
  - scope:
      path: ""
      type: principles
    values:
      layout: principle
