<form
 id="careers-native-form"
 class="careers-native-form"
 action="https://docs.google.com/forms/d/e/1FAIpQLScUz-ulzJoO6KbdtevGb5nr2JJI3uvaFQD2dcrV-oQPkMT4Hw/formResponse"
 method="POST"
 target="careers-hidden-frame"
 novalidate
>
 <div class="cnf-grid">
 <label class="cnf-field">
 <span class="cnf-label">Email <em>*</em></span>
 <input type="email" name="emailAddress" required autocomplete="email" placeholder="you@company.com" />
 </label>

 <label class="cnf-field">
 <span class="cnf-label">Full name <em>*</em></span>
 <input type="text" name="entry.582427878" required autocomplete="name" placeholder="Your full name" />
 </label>

 <label class="cnf-field">
 <span class="cnf-label">Phone <em>*</em></span>
 <input type="tel" name="entry.2046612031" required autocomplete="tel" placeholder="+1 / +91 …" />
 </label>

 <label class="cnf-field">
 <span class="cnf-label">Years of experience <em>*</em></span>
 <select name="entry.582247072" required>
 <option value="" disabled selected>Select</option>
 <option value="1+">1+</option>
 <option value="2+">2+</option>
 <option value="3+">3+</option>
 <option value="4+">4+</option>
 <option value="5+">5+</option>
 </select>
 </label>

 <label class="cnf-field cnf-span-2">
 <span class="cnf-label">Work mode <em>*</em></span>
 <select name="entry.1453393844" required>
 <option value="" disabled selected>Select</option>
 <option value="Work from office (WFO)">Work from office (WFO)</option>
 <option value="Work from home (WFH)">Work from home (WFH)</option>
 <option value="Hybrid">Hybrid</option>
 <option value="Flexible (I'm OK with both)">Flexible (OK with both)</option>
 </select>
 </label>

 <label class="cnf-field cnf-span-2">
 <span class="cnf-label">Resume / CV link <em>*</em></span>
 <input type="url" name="entry.1491836537" required placeholder="https://drive.google.com/…" />
 <span class="cnf-hint">Open Drive / Dropbox / personal site link</span>
 </label>

 <label class="cnf-field">
 <span class="cnf-label">Last drawn CTC <em>*</em></span>
 <input type="number" name="entry.789016850" required min="0" step="0.1" placeholder="LPA" />
 <span class="cnf-hint">Lakh per annum</span>
 </label>

 <label class="cnf-field">
 <span class="cnf-label">Expected CTC <em>*</em></span>
 <input type="number" name="entry.1513670635" required min="0" step="0.1" placeholder="LPA" />
 <span class="cnf-hint">Keep it realistic</span>
 </label>

 <label class="cnf-field">
 <span class="cnf-label">Available to join <em>*</em></span>
 <select name="entry.494038897" required>
 <option value="" disabled selected>Select</option>
 <option value="Immediately">Immediately</option>
 <option value="10-15 days">10–15 days</option>
 <option value="15-30 days">15–30 days</option>
 <option value="30-45 days">30–45 days</option>
 <option value="45-60 days">45–60 days</option>
 <option value="60 days+">60 days+</option>
 </select>
 </label>

 <label class="cnf-field">
 <span class="cnf-label">Looking for <em>*</em></span>
 <select name="entry.602873797" required>
 <option value="" disabled selected>Select</option>
 <option value="Full-time (Contract)">Full-time (Contract)</option>
 <option value="Part-time (Contract)">Part-time (Contract)</option>
 <option value="Payroll / Permanent (on payroll)">Payroll / Permanent</option>
 <option value="Freelance / Consultant">Freelance / Consultant</option>
 </select>
 </label>

 <fieldset class="cnf-field cnf-span-2">
 <legend class="cnf-label">Top programming skills <em>*</em></legend>
 <div class="cnf-chips" data-required-group="skills">
 <label class="cnf-chip"><input type="checkbox" name="entry.1489591804" value="JVM Languages (Scala, Kotlin, Java)" /><span>JVM</span></label>
 <label class="cnf-chip"><input type="checkbox" name="entry.1489591804" value="Golang" /><span>Golang</span></label>
 <label class="cnf-chip"><input type="checkbox" name="entry.1489591804" value="Rust" /><span>Rust</span></label>
 <label class="cnf-chip"><input type="checkbox" name="entry.1489591804" value="Javascript" /><span>JavaScript</span></label>
 <label class="cnf-chip"><input type="checkbox" name="entry.1489591804" value="C, C++" /><span>C / C++</span></label>
 <label class="cnf-chip"><input type="checkbox" name="entry.1489591804" value="Shell" /><span>Shell</span></label>
 <label class="cnf-chip cnf-chip-other">
 <input type="checkbox" name="entry.1489591804" value="__other_option__" data-other-toggle="skills-other" />
 <span>Other</span>
 </label>
 </div>
 <input class="cnf-other-input" id="skills-other" type="text" name="entry.1489591804.other_option_response" placeholder="Other skill" disabled />
 </fieldset>

 <fieldset class="cnf-field cnf-span-2">
 <legend class="cnf-label">Platform experience</legend>
 <div class="cnf-chips">
 <label class="cnf-chip"><input type="checkbox" name="entry.1716876182" value="Apache Kafka / Flink / Confluent" /><span>Kafka / Flink</span></label>
 <label class="cnf-chip"><input type="checkbox" name="entry.1716876182" value="Apache Spark / Databricks" /><span>Spark / Databricks</span></label>
 <label class="cnf-chip"><input type="checkbox" name="entry.1716876182" value="Temporal" /><span>Temporal</span></label>
 <label class="cnf-chip"><input type="checkbox" name="entry.1716876182" value="Clickhouse" /><span>ClickHouse</span></label>
 <label class="cnf-chip"><input type="checkbox" name="entry.1716876182" value="Kubernetes" /><span>Kubernetes</span></label>
 <label class="cnf-chip cnf-chip-other">
 <input type="checkbox" name="entry.1716876182" value="__other_option__" data-other-toggle="platforms-other" />
 <span>Other</span>
 </label>
 </div>
 <input class="cnf-other-input" id="platforms-other" type="text" name="entry.1716876182.other_option_response" placeholder="Other platforms / projects" disabled />
 </fieldset>

 <label class="cnf-field cnf-span-2">
 <span class="cnf-label">Certifications</span>
 <select name="entry.2045735748">
 <option value="" selected>None / skip</option>
 <option value="CKA | CKAD">CKA / CKAD</option>
 <option value="CCDAK | CCAAK (Confluent)">CCDAK / CCAAK (Confluent)</option>
 <option value="AWS (Specify)">AWS</option>
 <option value="Azure (Specify)">Azure</option>
 <option value="GCP (Specify)">GCP</option>
 </select>
 </label>

 <label class="cnf-field cnf-span-2">
 <span class="cnf-label">OSS contributions</span>
 <textarea name="entry.19487465" rows="2" placeholder="Links to PRs, repos, or communities (optional)"></textarea>
 </label>
 </div>

 <div class="cnf-actions">
 <button type="submit" class="cnf-submit">Submit application</button>
 <p class="cnf-note">Questions? <a href="mailto:joinus@platformatory.com">joinus@platformatory.com</a></p>
 </div>

 <div class="cnf-success" hidden>
 <strong>Thanks, we got it.</strong>
 <p>We’ll get back to you soon. Questions? <a href="mailto:joinus@platformatory.com">joinus@platformatory.com</a></p>
 </div>
</form>

<iframe name="careers-hidden-frame" title="Form submission" class="cnf-hidden-frame" tabindex="-1"></iframe>

<script>
(function () {
 var form = document.getElementById("careers-native-form");
 if (!form) return;

 form.querySelectorAll("[data-other-toggle]").forEach(function (checkbox) {
 var input = document.getElementById(checkbox.getAttribute("data-other-toggle"));
 if (!input) return;
 checkbox.addEventListener("change", function () {
 input.disabled = !checkbox.checked;
 if (!checkbox.checked) input.value = "";
 else input.focus();
 });
 });

 form.addEventListener("submit", function (event) {
 var skills = form.querySelectorAll('input[name="entry.1489591804"]:checked');
 if (!skills.length) {
 event.preventDefault();
 alert("Please select at least one programming skill.");
 return;
 }

 var required = form.querySelectorAll("[required]");
 for (var i = 0; i < required.length; i++) {
 if (!required[i].checkValidity()) {
 event.preventDefault();
 required[i].reportValidity();
 return;
 }
 }

 var success = form.querySelector(".cnf-success");
 var actions = form.querySelector(".cnf-actions");
 var grid = form.querySelector(".cnf-grid");
 window.setTimeout(function () {
 if (grid) grid.hidden = true;
 if (actions) actions.hidden = true;
 if (success) success.hidden = false;
 form.reset();
 form.querySelectorAll(".cnf-other-input").forEach(function (el) {
 el.disabled = true;
 });
 }, 400);
 });
})();
</script>
