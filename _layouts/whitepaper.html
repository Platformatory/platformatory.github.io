<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-5CR3MF9");
    </script>
    <!-- End Google Tag Manager -->
    <title>
      {% if page.title %}{{page.title}} {% endif %} | {{ site.title | escape }}
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/png"
      href="{{ '/images/logo/favicon.png' | relative_url }}"
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Titillium+Web&display=swap"
      rel="stylesheet"
    />
    <link href="{{ '/assets/css/style.css' | relative_url }}" rel="stylesheet">
    {% include seo.html %}
  </head>

  <body class="whitepaper-page">
    {% include main-menu-mobile.html %}
    {% include header.html headerClass='header-extra' %}
    <main class="whitepaper{% if page.whitepaper_style %} whitepaper--{{ page.whitepaper_style }}{% endif %}">
      {{ content }}
    </main>
    {% include footer.html %}

    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="{{ '/assets/js/scripts.js' | relative_url }}"></script>
  </body>
</html>
